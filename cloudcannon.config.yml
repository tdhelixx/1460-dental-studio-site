_schema: _schema
source: .
collections_config:
  all_pages:
    path: .
    glob:
      - '**/*.html'
      - '!_*/**'
    name: All Pages
    icon: notes
    disable_url: false
    description: ''
    _enabled_editors:
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  patient_pages:
    path: for-patients
    name: Patient Pages
    icon: notes
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  service_categories:
    path: service-categories
    name: Service Categories
    icon: notes
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  services:
    path: services
    name: Services
    icon: notes
    disable_url: false
    description: ''
    preview:
      text:
      subtext:
      icon:
      icon_color:
      image:
      metadata:
        - text:
          icon:
          icon_color:
          image:
      gallery:
    _enabled_editors:
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  team_members:
    path: team-members
    name: Team Members
    icon: notes
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
_enabled_editors:
  - visual
  - content
_inputs:
  description:
    type: textarea
    cascade: true
  title:
    type: text
    cascade: true
data_config:
  navigation:
    path: _data/navigation.yml
editor:
  default_editor_config:
    content:
      bold: true
      format: p h1 h2 h3 h4 h5 h6 pre address div
      italic: true
      link: true
      redo: true
      undo: true
  default_path: /
timezone: Etc/UTC
_collection_groups:
  - collections:
      - all_pages
    heading: Content Management
  - collections:
      - services
      - service_categories
      - patient_pages
      - team_members
    heading: By Category
uploads:
  path: assets/images
