# CloudCannon Configuration for Astro + Skeleton
source: src
public_path: /
output_dir: dist
build_dir: dist
base_url: /

# Collections
collections_config:
  pages:
    path: src/pages
    output: true
    filter: strict
    name: Pages
    _enabled_editors:
      - visual
      - content
    schemas:
      default:
        path: schemas/page.md
  
  services:
    path: src/content/services
    output: true
    name: Services
    _enabled_editors:
      - visual
      - content
    schemas:
      default:
        path: schemas/service.md
  
  team:
    path: src/content/team
    output: true
    name: Team Members
    _enabled_editors:
      - visual
      - content
    schemas:
      default:
        path: schemas/team-member.md

# Data files
data_config:
  navigation:
    path: src/data/navigation.yml
  site_settings:
    path: src/data/site.yml

# Input types
_inputs:
  title:
    type: text
    label: Page Title
  description:
    type: textarea
    label: Meta Description
  image:
    type: image
    label: Featured Image
  content:
    type: markdown
    label: Content
  services:
    type: array
    label: Services
  testimonials:
    type: array
    label: Testimonials

# Editor configuration
_enabled_editors:
  - visual
  - content
  - source

# Build settings
build:
  output_dir: dist
  environment_variables:
    CLOUDCANNON_SITE_ID: 1460-dental-astro

# Markdown configuration
markdown:
  engine: goldmark
  goldmark:
    renderer:
      unsafe: true

# Site settings
timezone: America/Chicago
locale: en-US

# Visual editor
_editables:
  text:
    bold: true
    italic: true
    link: true
    format: p h1 h2 h3 h4 h5 h6
  block:
    format: p h1 h2 h3 h4 h5 h6
    bold: true
    italic: true
    link: true
    alignment: left center right
    lists: true
    image: true
    embed: true
    table: true

# SEO and meta
seo:
  title: "1460 Dental Studio"
  description: "Trusted Georgetown dentist offering compassionate, expert dental care for your whole family."
  image: /images/og-image.jpg
  url: https://1460dentalstudio.com 