# CloudCannon Configuration for 1460 Dental Studio
source: .
public_path: /
output_dir: dist
build_dir: dist
base_url: /

# Build Configuration
build:
  output_dir: dist
  install_command: "npm install"
  build_command: "npm run build"
  preview_command: "npm run preview"

# Collections Configuration - Hybrid Approach
collections_config:
  pages:
    path: src/pages
    output: true
    name: "Pages"
    description: "Website pages with visual editing"
    icon: "description"
    _enabled_editors:
      - visual
      - content  
      - source
    add_options:
      - name: "Add New Page"
        schema: page
        icon: "add"
    schemas:
      page:
        name: "Standard Page"
        description: "A standard website page"
        icon: "description"
    # Parser configuration for JavaScript frontmatter
    parser: 
      comment_parser: true
    _inputs:
      title:
        type: text
        label: "Page Title"
        comment: "The main title for this page"
      description:
        type: textarea
        label: "Meta Description"
        comment: "SEO description for search engines"
      hero_headline:
        type: text
        label: "Hero Headline"
        comment: "Main headline displayed on the page"
      hero_tagline:
        type: textarea
        label: "Hero Tagline"
        comment: "Supporting text under the headline"

  data:
    path: data
    output: false
    name: "Site Data"
    description: "Global site settings"
    icon: "settings"
    _enabled_editors:
      - data

# Data Configuration for global settings
data_config:
  site:
    path: data/site.yml
    name: "Site Settings"
    _enabled_editors:
      - data

# Global Input Configuration
_inputs:
  title:
    type: text
    label: "Title"
  description:
    type: textarea
    label: "Description"
  hero_headline:
    type: text
    label: "Hero Headline"
  hero_tagline:
    type: textarea
    label: "Hero Tagline"
  phone:
    type: text
    label: "Phone Number"
    comment: "Format: (512) 123-4567"
  email:
    type: email
    label: "Email Address"

# Visual Editor Configuration
_editables:
  text:
    bold: true
    italic: true
    underline: true
    link: true
    undo: true
    redo: true
  block:
    format: p h1 h2 h3 h4 h5 h6
    bold: true
    italic: true
    link: true
    alignment: left center right
    lists: true
    undo: true
    redo: true
  content:
    bold: true
    italic: true
    underline: true
    link: true
    format: p h1 h2 h3 h4 h5 h6
    undo: true
    redo: true

# Editor Configuration
_enabled_editors:
  - visual
  - content
  - data
  - source

# Markup Configuration  
markup:
  md:
    engine: markdown-it
    options:
      html: true
      breaks: false
      linkify: true

# Paths Configuration
paths:
  data: data
  static: public
  uploads: public/images

# Site Configuration
timezone: America/Chicago
locale: en-US

# Asset Configuration
uploads_dir: public/images
site_url: https://1460dentalstudio.com

# Generator Configuration
generator:
  metadata:
    markdown: markdown-it
    markdown-it:
      html: true
      breaks: true
      linkify: true 