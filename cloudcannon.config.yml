# CloudCannon Configuration for 1460 Dental Studio
source: .
public_path: /
output_dir: dist
build_dir: dist
base_url: /

# Build Configuration
build:
  output_dir: dist
  install_command: "npm install"
  build_command: "npm run build"
  preview_command: "npm run preview"

# Collections Configuration - Data-driven approach
collections_config:
  data:
    path: data
    output: false
    name: "Site Data"
    description: "Editable site data and content"
    icon: "settings"
    _enabled_editors:
      - data
    _inputs:
      title:
        type: text
        label: "Site Title"
      description:
        type: textarea
        label: "Site Description"
      phone:
        type: text
        label: "Phone Number"
      email:
        type: email
        label: "Email Address"

# Data Configuration  
data_config:
  site:
    path: data/site.yml
    name: "Site Settings"
    _enabled_editors:
      - data
  pages:
    path: data/pages.yml
    name: "Page Content"
    _enabled_editors:
      - data

# Global Input Configuration
_inputs:
  title:
    type: text
    label: "Title"
  description:
    type: textarea
    label: "Description"
  headline:
    type: text
    label: "Headline"
  tagline:
    type: text
    label: "Tagline"
  phone:
    type: text
    label: "Phone Number"
    comment: "Format: (512) 123-4567"
  email:
    type: email
    label: "Email Address"
  street:
    type: text
    label: "Street Address"
  city:
    type: text
    label: "City"
  state:
    type: text
    label: "State"
  zip:
    type: text
    label: "ZIP Code"

# Editor Configuration
_enabled_editors:
  - data
  - source

# Paths Configuration
paths:
  data: data
  static: public
  uploads: public/images

# Site Configuration
timezone: America/Chicago
locale: en-US

# Asset Configuration
uploads_dir: public/images
site_url: https://1460dentalstudio.com 