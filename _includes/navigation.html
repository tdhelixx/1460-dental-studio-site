<nav class="main-navigation">
    <div class="nav-container">
        <a href="/" class="logo">{{ site.title }}</a>
        <ul class="nav-menu">
            {% for item in site.data.navigation.main_navigation %}
            <li class="nav-item">
                <a href="{{ item.url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
                    {{ item.title }}
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</nav>
